name: voice-pack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "python/audio_voice.py"
      - "scripts/build_voice_pack.py"
      - ".github/workflows/voice-pack.yml"
      - "tests/test_voice.py"

permissions:
  contents: read

jobs:
  english-voice-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pack builder tests
        run: python -m unittest discover -s tests -p "test_voice.py" -v
      - name: Download and verify public-domain training-data voice model
        run: python scripts/build_voice_pack.py --fetch --output dist/OmniDrop-VoicePack-en_US-ljspeech-medium.zip
      - name: Smoke-test real CPU neural speech synthesis
        shell: bash
        run: |
          python -m pip install -r python/requirements-voice.txt
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tempfile
          import wave
          import zipfile

          sys.path.insert(0, "python")
          import worker
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              with zipfile.ZipFile("dist/OmniDrop-VoicePack-en_US-ljspeech-medium.zip") as archive:
                  archive.extractall(root)
              os.environ["OMNIDROP_VOICE_PACK_DIR"] = str(root / "models" / "voice-packs")
              source = root / "voice-smoke.txt"
              source.write_text("OmniDrop is ready for local narration.", encoding="utf-8")
              assert "text.to_speech" in worker.capabilities(), "Verified Piper model was not advertised"
              result = worker.handle({"command": "run", "action_id": "text.to_speech", "path": str(source)})
              assert result["ok"], result.get("error")
              assert result["remote"] is False
              with wave.open(result["output_path"], "rb") as wav:
                  assert wav.getnframes() > 100
                  assert wav.getframerate() > 10000
          PY
      - name: Verify archive and publish checksum
        shell: python
        run: |
          import hashlib
          import pathlib
          import zipfile
          archive = pathlib.Path("dist/OmniDrop-VoicePack-en_US-ljspeech-medium.zip")
          with zipfile.ZipFile(archive) as pack:
              assert pack.testzip() is None
              assert any(name.endswith("/manifest.json") for name in pack.namelist())
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(str(archive) + ".sha256").write_text(
              sha + "  " + archive.name + "\n", encoding="ascii"
          )
      - name: Upload optional model pack
        uses: actions/upload-artifact@v4
        with:
          name: OmniDrop-english-voice-pack
          path: |
            dist/OmniDrop-VoicePack-en_US-ljspeech-medium.zip
            dist/OmniDrop-VoicePack-en_US-ljspeech-medium.zip.sha256
          if-no-files-found: error
          retention-days: 30
