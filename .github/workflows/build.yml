name: build

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Python worker dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Python worker tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Stage, sign when configured, and smoke-test Windows package
        shell: pwsh
        env:
          # PRs never receive code-signing secrets, including same-repo PRs.
          OMNIDROP_CODESIGN_PFX_BASE64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OMNIDROP_CODESIGN_PFX_BASE64 || '' }}
          OMNIDROP_CODESIGN_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OMNIDROP_CODESIGN_PASSWORD || '' }}
        run: |
          ./scripts/package_windows.ps1 -BuildDir build -PackageDir package

      - name: Attest final Windows ZIP with Sigstore-backed GitHub provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: OmniDrop-*-windows-dev.zip

      - name: Upload Windows development package
        uses: actions/upload-artifact@v4
        with:
          name: OmniDrop-windows-dev
          path: |
            OmniDrop-*-windows-dev.zip
            OmniDrop-*-windows-dev.zip.sha256
          if-no-files-found: error

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -DOMNIDROP_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install Python worker dependencies
        run: python3 -m pip install -r python/requirements.txt
      - name: Python worker tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
