name: Feature request
description: Propose a file workflow or product capability.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem. OmniDrop is local-first; remote uploads
        or large model dependencies must be explicitly justified and opt-in.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What recurring file task should become easier?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe the input, action, and expected output.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Useful surfaces
      multiple: true
      options:
        - GUI
        - CLI
        - Explorer integration
        - Automation / agent API
  - type: textarea
    id: constraints
    attributes:
      label: Privacy, runtime requirements, and alternatives
      description: Explain sample file types, offline expectations or tools already tried.
    validations:
      required: false
