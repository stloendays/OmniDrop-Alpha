name: Bug report
description: Report reproducible OmniDrop behavior that is incorrect.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Before posting, remove personal paths,
        document text, private tokens and other sensitive data. For suspected
        security issues, follow SECURITY.md instead of submitting a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Desktop interface
        - CLI and scripting
        - Workflow Builder or Jobs
        - Folder Watch
        - Translation or voice (optional)
        - Installation or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open OmniDrop\n2. Drop ...\n3. Run ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OmniDrop version or commit
      description: Run omnidrop-cli --version for packaged builds.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant error text or diagnostics
      description: Do not attach sensitive files unless you are comfortable sharing them publicly.
